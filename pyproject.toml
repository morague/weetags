[project]
name = "weetags"
version = "2.0.2"
description = ""
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "attrs>=26.1.0",
    "psycopg>=3.3.4",
    "pymemcache>=4.0.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "requests>=2.34.2",
    "urllib3>=2.8.0",
    "certifi>=2026.10.18"
]
server = [
    "argon2-cffi>=25.1.0",
    "click>=8.5.0",
    "jinja2>=3.1.6",
    "pydantic>=2.13.5",
    "pyjwt>=2.15.0",
    "sanic==25.12.1",
    "sanic-ext==25.12.0",
    "multidict>=6.9.1"
]


[build-system]
requires = ["setuptools == 66.1.1"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
exclude = ["trees", "data", "tests", "weetags.server", "weetags.cli"]

[project.scripts]
wee = "weetags.cli:wee"


[tool.commitizen]
version = "2.0.2"
version_files = [
    "pyproject.toml:^version",
    "weetags/VERSION"
]
