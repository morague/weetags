[project]
name = "weetags"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "attrs>=26.1.0",
    "psycopg>=3.3.4",
    "pymemcache>=4.0.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "requests>=2.34.2",
]
server = [
    "argon2-cffi>=25.1.0",
    "click>=8.5.0",
    "jinja2>=3.1.6",
    "pydantic>=2.13.5",
    "pyjwt>=2.13.0",
    "sanic==25.12.1",
    "sanic-ext==25.12.0",
]


[build-system]
requires = ["setuptools == 66.1.1"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
exclude = ["trees", "data", "tests"]

[project.scripts]
wee = "weetags.cli:wee"
