services:
  weetags:
    build: .
    container_name: weetags
    restart: unless-stopped
    env_file: .env.dev
    ports:
      - 127.0.0.1:8000:8000
    command:
      - --host=0.0.0.0
      - --port=8000
      - --workers=4
    volumes:
      - ./data:/app/data
      - ./trees:/app/trees
      - ./databases:/app/databases
      - ./server.yml:/app/server.yml

