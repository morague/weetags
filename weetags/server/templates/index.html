{% import 'macros/notifications.html' as m_not with context %}

<!DOCTYPE html>
<html lang="en">
<head>
    {% block head %}
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"/>
        <link rel="stylesheet" href="/static/css/main.css"/>
        <title>Weetags</title>    
    {% endblock %}
</head>
<body>
    <div id="notifications" class="notifications-container">
        {% block notification %}
            {% for n in notifications %}
                {{ m_not.notification(n.level, n.message)}}
            {% endfor %}
        {% endblock %}
    </div>

    {% block main %}{% endblock %}

    <script type="text/javascript" src="/static/js/notifications.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
</body>
</html>
